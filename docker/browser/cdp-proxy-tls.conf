# The browser sidecar's CDP proxy on the lane's TLS (localOpenClawStack#92,
# RealityEngine_CI#668). Mounted over the image's /etc/nginx/cdp-proxy.conf by
# docker-compose.tls.yml; the image's s6 service runs
# `nginx -c /etc/nginx/cdp-proxy.conf`.
#
# CDP is unauthenticated, so the proxy is the only gate in front of a browser
# that can be driven at will: TLS 1.3 at the transport profile
# (re-transport-2026.11), and a client certificate from the lane CA required,
# checked against its CRL. The gateway presents its certificate through
# scripts/lib/lane-tls-preload.cjs. The hop from here to Chromium
# (127.0.0.1:9222 inside the container) is plaintext on the container's own
# loopback: an accepted deficiency (owner, 2026-11-08) until Chromium serves
# CDP over TLS.
#
# Chromium advertises its WebSocket at the plaintext scheme on host "localhost"
# (the Host it is sent), without a port. The JSON discovery responses are
# rewritten to wss on the address the client used, so the client connects back
# through this listener; OpenClaw only rewrites an advertised loopback URL for a
# non-loopback CDP host. The two sub_filters rewrite the scheme of a quoted URL
# value and its authority; devtoolsFrontendUrl's "ws=localhost/" query is left
# as it is.
events {}
http {
  server {
    listen 9223 ssl;
    ssl_certificate         /run/re-tls/browser/chain.pem;
    ssl_certificate_key     /run/re-tls/browser/key.pem;
    ssl_client_certificate  /run/re-tls/ca.crt;
    ssl_crl                 /run/re-tls/ca.crl;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.3;
    ssl_conf_command        Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ecdh_curve          X25519MLKEM768:X25519:secp384r1;
    ssl_session_tickets     off;

    location / {
      proxy_pass http://127.0.0.1:9222;
      proxy_set_header Host localhost;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400s;
      # Uncompressed, so the discovery JSON can be rewritten.
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/json;
      sub_filter_once off;
      sub_filter '"ws:' '"wss:';
      sub_filter '//localhost/' '//$http_host/';
    }
  }
}
